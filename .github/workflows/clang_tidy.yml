name: Clang-Tidy

on:
  pull_request:
    types: [opened, reopened, synchronize]
  merge_group:
  push:
    branches:
      - "experimental/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clang-tidy-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  clang-tidy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-version: 1.26.0
          disk-cache: clang-tidy
          repository-cache: true
          external-cache: true
      - name: Run clang-tidy
        # Scope limited to C++ targets. Rust targets are not yet validated against
        # this configuration and are explicitly excluded.
        run: bazel test --config=clang-tidy --lockfile_mode=error -- //score/mw/log/... //score/datarouter/... -//score/mw/log/rust/...
      - name: Show clang-tidy findings
        if: always()
        run: |
          bin="$(bazel info bazel-bin)"
          find -L "$bin" -name '*.AspectRulesLintClangTidy.out' | sort | while read -r report; do
            findings="$(grep -E 'warning:|error:' "$report" | grep -v 'clang-diagnostic-builtin-macro-redefined' || true)"
            if [ -n "$findings" ]; then
              echo "::group::${report#"$bin"/} (exit code: $(cat "${report%.out}.out.exit_code" 2>/dev/null))"
              echo "$findings"
              echo "::endgroup::"
            fi
          done
